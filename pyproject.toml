[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utm-services-platform"
version = "0.1.0"
description = "A UTM services startup platform and simulation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "hypothesis>=6.100,<7",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
utm-mock-api = "utm_services.api.app:run"

[tool.setuptools]
package-dir = {"" = "src", "shared" = "shared"}
packages = [
    "shared",
    "utm_services",
    "utm_services.api",
    "utm_services.application",
    "utm_services.evaluation",
    "utm_services.policy",
    "utm_services.safety",
    "utm_services.simulation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "shared", "tests"]
