[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utm-services-platform"
version = "0.1.0"
description = "A UTM services startup platform and simulation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "daqp>=0.10.3,<1",
    "numba>=0.60,<1",
    "numpy>=1.26,<3",
    "osqp>=0.6.2,<1",
    "pydantic>=2.7,<3",
    "scipy>=1.11,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.8,<1",
]
# PyBullet quadrotor backend (Linux/WSL only: pybullet has no Windows wheels).
# gym-pybullet-drones is not on PyPI; install it with --no-deps, see simulation/pybullet_env.py.
physics = [
    "gymnasium>=1.0,<2",
    "pillow>=12.3,<13",
    "pybullet>=3.2.7,<4",
    "transforms3d>=0.4,<1",
]
# MARL training (P2-SA-01). The runtime policy (policy/learned.py) needs only numpy.
train = [
    "torch==2.5.1",
]
# Replay plot for utm-run --plot.
plot = [
    "matplotlib>=3.8,<4",
]

[project.scripts]
utm-mock-api = "utm_services.api.app:run"
utm-run = "utm_services.evaluation.cli:main"
utm-train = "utm_services.training.mappo:main"
utm-eval-policy = "utm_services.training.evaluate:main"
utm-replay = "utm_services.training.replay:main"
utm-city-check = "utm_services.training.city_eval:main"

[tool.setuptools]
package-dir = {"" = "src", "shared" = "shared"}
packages = [
    "shared",
    "utm_services",
    "utm_services.api",
    "utm_services.application",
    "utm_services.evaluation",
    "utm_services.policy",
    "utm_services.safety",
    "utm_services.simulation",
    "utm_services.training",
]

[tool.setuptools.package-data]
"utm_services.training" = ["viewer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Default run: the fast suite, in parallel. `pytest -m slow` runs the slow suite, `pytest -m ""` everything,
# `-n0` one process (for debugging). CI runs the fast suite on every push and the slow suite on PRs to main.
addopts = "-n auto -m 'not slow'"
markers = ["slow: fuzz, sweeps and long closed-loop episodes (run with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "shared", "tests"]
