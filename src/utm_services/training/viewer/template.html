<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9f3; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #view { position: absolute; inset: 0; }
  .panel { position: absolute; background: rgba(18, 24, 32, 0.80); color: #eef2f6; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.45; backdrop-filter: blur(4px); }
  #info { top: 12px; left: 12px; max-width: 420px; }
  #info h1 { font-size: 14px; margin: 0 0 4px 0; font-weight: 600; }
  #info .sub { opacity: 0.75; font-size: 12px; }
  #info .note { margin-top: 6px; font-size: 11.5px; opacity: 0.85; color: #ffd98a; }
  #drones { top: 12px; right: 12px; min-width: 250px; }
  #drones table { border-collapse: collapse; width: 100%; }
  #drones td { padding: 2px 6px 2px 0; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; border: 1px solid #000; vertical-align: -1px; }
  .chip { font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: #3b4552; }
  .chip.shield { background: #e0a100; color: #1b1500; }
  .chip.arrived { background: #2e7d4f; }
  .chip.close { background: #d32f2f; }
  .chip.aborted { background: #8e24aa; }
  #hud { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 6px; font-variant-numeric: tabular-nums; }
  #bar { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; max-width: 96vw; }
  button, select { background: #2b3644; color: #eef2f6; border: 1px solid #46556a; border-radius: 7px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
  button:hover { background: #3a4a5e; }
  button.on { background: #2f6fed; border-color: #5b92ff; }
  input[type=range] { vertical-align: middle; }
  #timeline { width: 320px; }
  label.t { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12.5px; }
  #help { left: 12px; bottom: 100px; max-width: 520px; font-size: 12px; opacity: 0.92; }
  .tag { position: absolute; pointer-events: none; font-size: 12px; font-weight: 700; color: #111; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; transform: translate(-50%, -100%); white-space: nowrap; }
  .tag.goal { font-weight: 600; font-size: 11px; opacity: 0.85; }
  .sep { opacity: 0.35; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<div id="info" class="panel">
  <h1>__TITLE__</h1>
  <div class="sub" id="summary"></div>
  <div class="note" id="note"></div>
  <div id="hud"></div>
</div>

<div id="drones" class="panel"><table id="dtable"></table></div>

<div id="help" class="panel">
  <b>Drag</b> orbit &nbsp; <b>Right-drag</b> / <b>Shift-drag</b> pan &nbsp; <b>Wheel</b> zoom &nbsp; <b>Space</b> play/pause<br>
  <b>1</b> iso &nbsp; <b>2</b> top &nbsp; <b>3</b> side &nbsp; <b>4</b> front &nbsp; <b>F</b> follow next drone &nbsp; <b>R</b> reset view<br>
  Halo colour: <b>amber</b> = safety filter changing this drone's command, <b>red</b> = within 5 m of another drone. The halo's size is decoration.
</div>

<div id="bar" class="panel">
  <button id="play">Pause</button>
  <input id="timeline" type="range" min="0" max="1000" value="0">
  <span id="clock" style="min-width:64px;font-variant-numeric:tabular-nums">0.0 s</span>
  <select id="speed" title="playback speed">
    <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
    <option value="2">2x</option><option value="4">4x</option>
  </select>
  <span class="sep">|</span>
  <button data-view="iso">Iso</button><button data-view="top">Top</button><button data-view="side">Side</button><button data-view="front">Front</button>
  <select id="follow" title="follow a drone"><option value="">Free camera</option></select>
  <span class="sep">|</span>
  <label class="t"><input type="checkbox" id="tTrails" checked>trails</label>
  <label class="t"><input type="checkbox" id="tHalo" checked>halos</label>
  <label class="t"><input type="checkbox" id="tLabels" checked>labels</label>
  <label class="t"><input type="checkbox" id="tXray">see-through buildings</label>
  <label class="t"><input type="checkbox" id="tBox">airspace box</label>
  <label class="t">drone size <input type="range" id="size" min="4" max="40" value="22" style="width:90px"></label>
</div>

<script>__THREE__</script>
<script>__ORBIT__</script>
<script>
"use strict";
const D = __DATA__;
const dt = D.dt_s;
const nF = D.times_ms.length;
const T_END = (nF - 1) * dt;
const nD = D.ids.length;

// ------------------------------------------------------------------ renderer / scene
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0xdbe7f3;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 1800, 5200);
const camera = new THREE.PerspectiveCamera(50, 1, 1, 8000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.maxPolarAngle = Math.PI * 0.499;
controls.screenSpacePanning = true;
controls.minDistance = 8;
controls.maxDistance = 3500;

const B = D.bounds;                       // [xmin, ymin, xmax, ymax, ztop]
const cx = (B[0] + B[2]) / 2, cy = (B[1] + B[3]) / 2;
const ext = Math.max(B[2] - B[0], B[3] - B[1], 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8e9a8e, 0.85);
hemi.position.set(0, 0, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(cx - ext * 0.7, cy - ext * 0.9, ext * 1.4);
sun.target.position.set(cx, cy, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -ext * 0.95; sc.right = ext * 0.95; sc.top = ext * 0.95; sc.bottom = -ext * 0.95; sc.near = 10; sc.far = ext * 4;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// ground + grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshStandardMaterial({ color: 0xc9d4c6, roughness: 1.0, metalness: 0.0 }));
ground.position.set(cx, cy, 0);
ground.receiveShadow = true;
scene.add(ground);
const gsize = Math.ceil((ext + 400) / 100) * 100;
const grid = new THREE.GridHelper(gsize, gsize / 50, 0x7f8c7f, 0xaab5a8);
grid.rotation.x = Math.PI / 2;
grid.position.set(Math.round(cx / 50) * 50, Math.round(cy / 50) * 50, 0.15);
grid.material.transparent = true; grid.material.opacity = 0.65;
scene.add(grid);

// airspace box (world x,y in [0,1000], z in [30,200])
const airBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1000, 1000, 170)),
  new THREE.LineBasicMaterial({ color: 0x2f6fed, transparent: true, opacity: 0.55 }));
airBox.position.set(500, 500, 115);
airBox.visible = false;
scene.add(airBox);

// ------------------------------------------------------------------ buildings
function windowTexture(seed) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#8b95a3"; g.fillRect(0, 0, 64, 64);
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const lit = rnd() < 0.28;
    g.fillStyle = lit ? "#ffe9a8" : "#3b4a60";
    g.fillRect(i * 16 + 3, j * 16 + 3, 10, 10);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  t.magFilter = THREE.NearestFilter;
  return t;
}
const buildingMeshes = [];
D.buildings.forEach((b, i) => {
  const geo = new THREE.BoxGeometry(b.sx, b.sy, b.h);
  const tone = 1 - 0.35 * Math.min(1, b.h / 170);
  const wallTint = new THREE.Color(tone, tone, tone * 1.04);
  const mk = (repU, repV) => {
    const t = windowTexture(i + 1); t.repeat.set(repU, repV);
    return new THREE.MeshStandardMaterial({ map: t, color: wallTint, roughness: 0.85, metalness: 0.05 });
  };
  const win = 8;                       // metres per window cell
  const roof = new THREE.MeshStandardMaterial({ color: 0xd9dce2, roughness: 0.9 });
  const mats = [mk(b.h / win, b.sy / win), mk(b.h / win, b.sy / win),   // +x, -x : u along z, v along y
                mk(b.sx / win, b.h / win), mk(b.sx / win, b.h / win),   // +y, -y : u along x, v along z
                roof, roof];
  const m = new THREE.Mesh(geo, mats);
  m.position.set(b.cx, b.cy, b.h / 2);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x28313d, transparent: true, opacity: 0.55 }));
  e.position.copy(m.position);
  scene.add(e);
  buildingMeshes.push({ mesh: m, mats, edge: e });
});
function setXray(on) {
  buildingMeshes.forEach(o => {
    o.mats.forEach(mt => { mt.transparent = on; mt.opacity = on ? 0.28 : 1.0; mt.depthWrite = !on; mt.needsUpdate = true; });
    o.mesh.castShadow = !on;
  });
}

// ------------------------------------------------------------------ drones, goals, trails
const colorOf = k => new THREE.Color(D.colors[k % D.colors.length]);
const drones = [];
function makeDrone(color) {
  const g = new THREE.Group();
  const dark = new THREE.MeshStandardMaterial({ color: 0x1b1f26, roughness: 0.6, metalness: 0.2 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.36, 0.15),
    new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.25 }));
  body.castShadow = true; g.add(body);
  [Math.PI / 4, -Math.PI / 4].forEach(a => {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.075, 0.055), dark);
    arm.rotation.z = a; arm.castShadow = true; g.add(arm);
  });
  const rotors = [];
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sy]) => {
    const r = new THREE.Group();
    r.position.set(sx * 0.3535, sy * 0.3535, 0.075);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.09, 12), dark);
    hub.rotation.x = Math.PI / 2; r.add(hub);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.012, 24),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, depthWrite: false }));
    disc.rotation.x = Math.PI / 2; r.add(disc);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.035, 0.012),
      new THREE.MeshBasicMaterial({ color: 0x111111 }));
    r.add(blade);
    g.add(r); rotors.push(r);
  });
  return { group: g, rotors };
}
const halos = [], stems = [], blobs = [], trailMeshes = [], tagEls = [], goalTags = [];
const labelsDiv = document.getElementById("labels");
const beadGeo = new THREE.SphereGeometry(1, 8, 6);
const tmpM = new THREE.Matrix4();
for (let k = 0; k < nD; k++) {
  const col = colorOf(k);
  const d = makeDrone(col); scene.add(d.group); drones.push(d);

  const halo = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.14, depthWrite: false }));
  scene.add(halo); halos.push(halo);

  const stemGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const stem = new THREE.Line(stemGeo, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.45 }));
  scene.add(stem); stems.push(stem);

  const blob = new THREE.Mesh(new THREE.CircleGeometry(1, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
  scene.add(blob); blobs.push(blob);

  const beads = new THREE.InstancedMesh(beadGeo, new THREE.MeshBasicMaterial({ color: col }), nF);
  for (let f = 0; f < nF; f++) {
    const p = D.pos[k][f];
    tmpM.makeScale(1.05, 1.05, 1.05); tmpM.setPosition(p[0], p[1], p[2]);
    beads.setMatrixAt(f, tmpM);
  }
  beads.count = 0; beads.frustumCulled = false;
  scene.add(beads); trailMeshes.push(beads);

  // goal marker: ring at goal altitude + dashed post + label
  const g = D.goals[k];
  const ring = new THREE.Mesh(new THREE.TorusGeometry(6, 0.9, 10, 40), new THREE.MeshBasicMaterial({ color: col }));
  ring.position.set(g[0], g[1], g[2]); scene.add(ring);
  const post = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(g[0], g[1], 0), new THREE.Vector3(g[0], g[1], g[2])]),
    new THREE.LineDashedMaterial({ color: col, dashSize: 4, gapSize: 4, transparent: true, opacity: 0.6 }));
  post.computeLineDistances(); scene.add(post);

  const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = D.ids[k];
  tag.style.color = "#" + col.getHexString(); labelsDiv.appendChild(tag); tagEls.push(tag);
  const gt = document.createElement("div"); gt.className = "tag goal"; gt.textContent = "goal " + D.ids[k];
  labelsDiv.appendChild(gt); goalTags.push(gt);
}

// ------------------------------------------------------------------ HUD
document.getElementById("summary").innerHTML = D.summary_html;
document.getElementById("note").textContent = D.note;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dtable = document.getElementById("dtable");
const rows = D.ids.map((id, k) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><span class="dot" style="background:${D.colors[k % D.colors.length]}"></span><b>${esc(id)}</b></td>` +
                 `<td class="spd" style="text-align:right"></td><td class="alt" style="text-align:right"></td><td class="st"></td>`;
  dtable.appendChild(tr); return tr;
});
const hud = document.getElementById("hud");
const followSel = document.getElementById("follow");
D.ids.forEach(id => { const o = document.createElement("option"); o.value = id; o.textContent = "Follow " + id;   /* textContent: safe */ followSel.appendChild(o); });

// ------------------------------------------------------------------ camera presets
const F = D.flight;                       // [xmin, ymin, xmax, ymax] of drone tracks and goals
const center = new THREE.Vector3((F[0] + F[2]) / 2, (F[1] + F[3]) / 2, 70);
const dist = Math.max(Math.max(F[2] - F[0], F[3] - F[1]) * 1.0 + 140, 240);
const PRESETS = {
  iso:   { p: new THREE.Vector3(center.x + dist * 0.75, center.y - dist * 0.85, center.z + dist * 0.55) },
  top:   { p: new THREE.Vector3(center.x + 0.001, center.y - 0.001, center.z + dist * 1.45) },
  side:  { p: new THREE.Vector3(center.x + dist * 1.25, center.y, center.z + dist * 0.12) },
  front: { p: new THREE.Vector3(center.x, center.y - dist * 1.25, center.z + dist * 0.12) },
};
let tween = null;
function goView(name) {
  followSel.value = ""; follow = null;
  const p = PRESETS[name].p;
  tween = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: p.clone(), toT: center.clone() };
  document.querySelectorAll("button[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === name));
}
function snapView(name) {
  camera.position.copy(PRESETS[name].p); controls.target.copy(center); controls.update();
}

// ------------------------------------------------------------------ interaction state
let playing = true, speed = 1, tSec = 0, follow = null, holdUntil = 0;
const playBtn = document.getElementById("play"), timeline = document.getElementById("timeline"), clock = document.getElementById("clock");
function setPlaying(v) { playing = v; playBtn.textContent = v ? "Pause" : "Play"; }
playBtn.onclick = () => { if (!playing && tSec >= T_END - 1e-6) tSec = 0; setPlaying(!playing); };
timeline.oninput = () => { tSec = (timeline.value / 1000) * T_END; setPlaying(false); };
document.getElementById("speed").onchange = e => { speed = parseFloat(e.target.value); };
document.querySelectorAll("button[data-view]").forEach(b => b.onclick = () => goView(b.dataset.view));
// Start a follow camera above and behind the drone, along its direction of travel.
function followPose(k) {
  const a = dronePos(k, Math.max(0, tSec - 0.6)), b = dronePos(k, Math.min(T_END, tSec + 0.6)), p = dronePos(k, tSec);
  const h = new THREE.Vector3(b.x - a.x, b.y - a.y, 0);
  if (h.length() < 0.5) h.set(1, 0, 0);
  h.normalize();
  return { pos: new THREE.Vector3(p.x - h.x * 95, p.y - h.y * 95, p.z + 60), target: p };
}
followSel.onchange = () => {
  follow = followSel.value ? D.ids.indexOf(followSel.value) : null;
  if (follow !== null) { const f = followPose(follow); tween = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(),
      toP: f.pos, toT: f.target.clone() }; }
};
const tTrails = document.getElementById("tTrails"), tHalo = document.getElementById("tHalo"), tLabels = document.getElementById("tLabels");
document.getElementById("tXray").onchange = e => setXray(e.target.checked);
document.getElementById("tBox").onchange = e => { airBox.visible = e.target.checked; };
let span = 22;
document.getElementById("size").oninput = e => { span = parseFloat(e.target.value); };
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  else if (e.key === "1") goView("iso"); else if (e.key === "2") goView("top");
  else if (e.key === "3") goView("side"); else if (e.key === "4") goView("front");
  else if (e.key === "r" || e.key === "R") goView("iso");
  else if (e.key === "f" || e.key === "F") {
    const i = follow === null ? 0 : (follow + 1) % nD; followSel.value = D.ids[i]; followSel.onchange();
  }
});

// ------------------------------------------------------------------ per-frame state
const _v = new THREE.Vector3();
function dronePos(k, t) {
  const f = Math.min(nF - 1, Math.max(0, t / dt)), i = Math.floor(f), a = f - i, j = Math.min(nF - 1, i + 1);
  const p = D.pos[k][i], q = D.pos[k][j];
  return _v.set(p[0] + (q[0] - p[0]) * a, p[1] + (q[1] - p[1]) * a, p[2] + (q[2] - p[2]) * a).clone();
}
function fmt(x, n) { return x === null || x === undefined ? "n/a" : x.toFixed(n); }
function fmtm(x, n) { return x === null || x === undefined ? "n/a (fewer than 2 drones flying)" : x.toFixed(n) + " m"; }
function update(dtReal) {
  if (playing) {
    if (tSec >= T_END) { if (performance.now() > holdUntil) { if (holdUntil === 0) { holdUntil = performance.now() + 1200; } else { tSec = 0; holdUntil = 0; } } }
    else { tSec = Math.min(T_END, tSec + dtReal * speed); }
  }
  timeline.value = Math.round((tSec / T_END) * 1000);
  clock.textContent = tSec.toFixed(1) + " s";
  const fi = Math.min(nF - 1, Math.round(tSec / dt));
  const spanNow = span;
  for (let k = 0; k < nD; k++) {
    const p = dronePos(k, tSec);
    const d = drones[k];
    d.group.position.copy(p); d.group.scale.setScalar(spanNow);
    const arrived = D.arrived[k][fi] || D.aborted[k][fi];
    d.group.visible = !arrived;                 // the simulator stops checking finished drones, so stop drawing them
    stems[k].visible = !arrived; blobs[k].visible = !arrived;
    d.rotors.forEach((r, n) => { r.rotation.z += (arrived ? 0 : 1) * dtReal * (38 + 3 * n) * (n % 2 ? -1 : 1); });
    const shield = D.shield[k][fi], near = D.near[k][fi] !== null && D.near[k][fi] < D.dsafe;
    halos[k].position.copy(p); halos[k].scale.setScalar(spanNow * 0.78);
    halos[k].visible = tHalo.checked && !arrived;
    halos[k].material.color.set(near ? 0xe53935 : shield ? 0xffb300 : D.colors[k % D.colors.length]);
    halos[k].material.opacity = near ? 0.42 : shield ? 0.30 : 0.13;
    const pa = stems[k].geometry.attributes.position;
    pa.setXYZ(0, p.x, p.y, 0.2); pa.setXYZ(1, p.x, p.y, p.z); pa.needsUpdate = true;
    blobs[k].position.set(p.x, p.y, 0.25); blobs[k].scale.setScalar(spanNow * 0.5);
    trailMeshes[k].count = tTrails.checked ? Math.min(nF, fi + 1) : 0;
    const tr = rows[k];
    tr.querySelector(".spd").textContent = fmt(D.speed[k][fi], 1) + " m/s";
    tr.querySelector(".alt").textContent = "z " + fmt(p.z, 0);
    tr.querySelector(".st").innerHTML = D.aborted[k][fi] ? '<span class="chip aborted">aborted</span>' : arrived ? '<span class="chip arrived">arrived</span>'
      : near ? '<span class="chip close">&lt; d_safe</span>' : shield ? '<span class="chip shield">filter active</span>' : '<span class="chip">nominal</span>';
  }
  hud.innerHTML = `t = <b>${tSec.toFixed(1)} s</b> &nbsp; min drone-drone separation <b>${fmtm(D.min_sep[fi], 1)}</b> (d_safe ${D.dsafe} m)` +
    (D.min_clear.some(v => v !== null) ? `<br>nearest building to any drone (measured, not controlled) <b>${fmt(D.min_clear[fi], 1)} m</b>` : "");
  if (follow !== null && !tween) {
    const p = dronePos(follow, tSec);
    const delta = p.clone().sub(controls.target);
    camera.position.add(delta); controls.target.copy(p);
  }
}
function placeLabels() {
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  const show = tLabels.checked;
  const proj = (v, el, dy) => {
    _v.copy(v).project(camera);
    const vis = show && _v.z < 1 && _v.z > -1;
    el.style.display = vis ? "block" : "none";
    if (vis) { el.style.left = ((_v.x + 1) / 2 * w) + "px"; el.style.top = ((1 - _v.y) / 2 * h + dy) + "px"; }
  };
  for (let k = 0; k < nD; k++) {
    proj(drones[k].group.position.clone().add(new THREE.Vector3(0, 0, span * 0.5)), tagEls[k], 0);
    proj(new THREE.Vector3(D.goals[k][0], D.goals[k][1], D.goals[k][2] + 8), goalTags[k], 0);
  }
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();

// URL hash for reproducible screenshots: #t=0.5&view=top&pause=1&follow=d1&xray=1&box=1&size=16
const H = new URLSearchParams(location.hash.slice(1));
snapView(H.get("view") && PRESETS[H.get("view")] ? H.get("view") : "iso");
if (H.get("t")) tSec = Math.min(1, Math.max(0, parseFloat(H.get("t")))) * T_END;
if (H.get("pause")) setPlaying(false);
if (H.get("xray")) { document.getElementById("tXray").checked = true; setXray(true); }
if (H.get("box")) { document.getElementById("tBox").checked = true; airBox.visible = true; }
if (H.get("size")) { span = parseFloat(H.get("size")); document.getElementById("size").value = span; }
if (H.get("follow")) { followSel.value = H.get("follow"); follow = D.ids.indexOf(H.get("follow")); if (follow >= 0) {
  const f = followPose(follow); camera.position.copy(f.pos); controls.target.copy(f.target); controls.update(); } }

let last = performance.now();
function loop(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  update(dtReal);
  if (tween) {
    if (follow !== null) { const f = followPose(follow); tween.toP = f.pos; tween.toT = f.target.clone(); }   // aim at the drone's current pose
    tween.t = Math.min(1, tween.t + dtReal / 0.7);
    const e = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    camera.position.lerpVectors(tween.fromP, tween.toP, e);
    controls.target.lerpVectors(tween.fromT, tween.toT, e);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  if (camera.position.z < 2) camera.position.z = 2;
  placeLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__viewerReady = true;

// Self-test (only with #selftest=1): synthetic mouse drag + wheel through the real event path.
if (H.get("selftest")) {
  setTimeout(() => {
    const el = renderer.domElement, p0 = camera.position.clone();
    const ev = (type, x, y, extra) => new PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, pointerId: 1, pointerType: "mouse",
      clientX: x, clientY: y, button: 0, buttons: type === "pointerup" ? 0 : 1 }, extra || {}));
    el.dispatchEvent(ev("pointerdown", 800, 500));
    for (let i = 1; i <= 10; i++) document.dispatchEvent(ev("pointermove", 800 + 25 * i, 500 - 8 * i));
    document.dispatchEvent(ev("pointerup", 1050, 420));
    controls.update();
    const p1 = camera.position.clone(), d0 = p1.distanceTo(controls.target);
    el.dispatchEvent(new WheelEvent("wheel", { deltaY: -400, bubbles: true, cancelable: true }));
    controls.update();
    const d1 = camera.position.distanceTo(controls.target);
    console.log("SELFTEST orbit moved camera by " + p0.distanceTo(p1).toFixed(1) + " m; zoom changed distance " + d0.toFixed(1) + " -> " + d1.toFixed(1));
    document.title = "SELFTEST " + (p0.distanceTo(p1) > 1 ? "orbit-ok" : "orbit-FAILED") + " " + (d1 < d0 ? "zoom-ok" : "zoom-FAILED");
  }, 800);
}
</script>
